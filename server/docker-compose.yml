services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"   # 局域网设备连接（明文+密码）；TLS(8883) 后续 ticket 补上
    volumes:
      - ./mosquitto:/mosquitto/config:ro   # mosquitto.conf + password（password 本地生成，不入库）
      - mosquitto-data:/mosquitto/data

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      SCT_SENDKEY: ${SCT_SENDKEY:-}   # Server酱 SendKey，空则告警只打日志
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-60}
      EVENTS_DB: /data/events.db
    volumes:
      - ./data:/data   # SQLite 事件库（本地持久化，不入 git）
    ports:
      - "8000:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}   # Phase 4 在 .env 里填入命名隧道 token
    profiles:
      - external   # Phase 4 才启用：docker compose --profile external up -d

volumes:
  mosquitto-data:
